name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  # 1. Unit & component tests (Vitest — apps/web)
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests (apps/web)
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --experimental-vm-modules
      FORCE_COLOR: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Run linting (all workspaces)
        run: npm run lint --workspace=apps/web

      - name: Run unit tests
        run: npm run test --workspace=apps/web

      - name: Generate coverage report
        run: npm run test:coverage --workspace=apps/web

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. Build (apps/web)
  # ─────────────────────────────────────────────
  build:
    name: Build (apps/web)
    runs-on: ubuntu-latest
    needs: test

    env:
      NODE_OPTIONS: --experimental-vm-modules
      # Provide stub env vars so Vite build doesn't fail on missing Supabase config
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Playwright E2E tests (e2e workspace)
  # ─────────────────────────────────────────────
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build

    env:
      # Provide enough config so the Vite dev server starts
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests
        run: npm run test --workspace=e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (screenshots & videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload visual regression snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-snapshots
          path: e2e/tests/**/*-snapshots/
          retention-days: 14

  # ─────────────────────────────────────────────
  # 4. Type-check live-bridge service
  # ─────────────────────────────────────────────
  typecheck-bridge:
    name: Type Check (services/live-bridge)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Type-check live-bridge
        run: npx tsc --noEmit
        working-directory: services/live-bridge

  # ─────────────────────────────────────────────
  # 5. CRG Integration Tests (main branch only)
  #
  #    Spins up the real CRG scoreboard + the
  #    Python scoreboard-api proxy and runs
  #    integration-tagged Playwright tests against
  #    the full stack.
  #
  #    This job is required to merge PRs into main
  #    but does NOT run on dev pushes or PRs to dev.
  # ─────────────────────────────────────────────
  integration:
    name: Integration Tests (CRG + API)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout CRG Scoreboard
        uses: actions/checkout@v4
        with:
          repository: rollerderby/scoreboard
          path: scoreboard
          ref: v2025.9

      - name: Checkout Scoreboard API
        uses: actions/checkout@v4
        with:
          repository: a1ly404/derby-scoreboard-api
          path: scoreboard-api

      # ── Java (for CRG) ──────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build CRG Scoreboard
        run: ant compile
        working-directory: scoreboard

      # ── Python (for scoreboard-api) ──────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scoreboard-api dependencies
        run: pip install -r requirements.txt
        working-directory: scoreboard-api

      # ── Node (for Playwright + monorepo) ─────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # ── Start services ───────────────────────────
      - name: Start CRG Scoreboard (background)
        run: |
          java -Done-jar.silent=true \
               -Dorg.eclipse.jetty.server.LEVEL=WARN \
               -jar lib/crg-scoreboard.jar --port=8000 &
          echo "Waiting for CRG to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/ > /dev/null 2>&1; then
              echo "CRG is up on :8000"
              break
            fi
            sleep 1
          done
        working-directory: scoreboard

      - name: Start Scoreboard API (background)
        run: |
          python main.py \
            --scoreboard-host localhost \
            --scoreboard-port 8000 \
            --host 0.0.0.0 \
            --port 5001 &
          echo "Waiting for Scoreboard API to start..."
          for i in $(seq 1 15); do
            if curl -s http://localhost:5001/health > /dev/null 2>&1; then
              echo "Scoreboard API is up on :5001"
              break
            fi
            sleep 1
          done
        working-directory: scoreboard-api

      # ── Run integration tests ────────────────────
      - name: Run integration Playwright tests
        run: npx playwright test --grep @integration
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          SCOREBOARD_API_URL: http://localhost:5001
          CRG_URL: http://localhost:8000
          INTEGRATION: "true"

      # ── Artifacts ────────────────────────────────
      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: e2e/test-results/
          retention-days: 14

  # ─────────────────────────────────────────────
  # 6. Deploy to Vercel (Production — main branch)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [test, e2e, integration]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          # Root directory is configured in Vercel dashboard as apps/web
          # vercel.json lives at apps/web/vercel.json

  # ─────────────────────────────────────────────
  # 7. Deploy to Vercel (Preview — dev branch / PRs)
  # ─────────────────────────────────────────────
  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/dev' || github.event.pull_request.head.ref == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
